{% load i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<h2>{% trans "Zerasix user Login" %}</h2>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% trans "Zerasix's Mancala" %}{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <form action="{% url 'set_language' %}" method="post" class="d-flex align-items-center m-0 text-black">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}" />
        <label for="languageSelect" class="me-2 small">{% trans "Language:" %}</label>
        <select name="language" id="languageSelect" onchange="this.form.submit()" class="form-select form-select-sm text-black border-secondary" style="width: auto;">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% for lang in LANGUAGES %}
                <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
                    {{ lang.1 }} ({{ lang.0 }})
                </option>
            {% endfor %}
        </select>
    </form>
<form method="post">
    {% csrf_token %} {{ form.as_p }}
    <button type="submit">{% trans "Login" %}</button>
</form>
<hr />
<p>{% trans "Don't have an account?" %} <a href="{% url 'signup' %}">{% trans "Sign up here" %}</a></p>
<p>{% trans "About-us" %} <a href="{% url 'about_us' %}">{% trans "About-us" %}</a></p>
</body>
</html>
