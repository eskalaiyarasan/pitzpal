{% extends 'common/base.html' %}
{% load i18n %}
{% block title %} {% trans "Search for  friends"%} {% endblock %}

{% block content %}
<form method="GET">
  <input type="text" name="q" placeholder="Search user">
</form>

{% for user in results %}
  <p>
    {{ user.username }}
    <a href="{% url 'send_request' user.id %}"> {% trans "Send Request"%} </a>
  </p>
{% endfor %}
{% endblock %}
