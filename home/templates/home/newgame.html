{% extends 'common/base.html' %}
{% load i18n %}
{% block title %} {% trans "New Game" %} {% endblock %}

{% block content %}
<!-- Load React, ReactDOM, and Babel via CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Mount point for React -->
<div id="react-pitzpal-root"></div>

<!-- Audio Synthesizer using Web Audio API for crisp, single-tone, ultra-short sounds -->
<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSynthTone(frequency, type, duration, pitchEnd = null) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        if (pitchEnd !== null) {
            osc.frequency.exponentialRampToValueAtTime(pitchEnd, audioCtx.currentTime + duration);
        }

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
</script>

<!-- React Application Code -->
<script type="text/babel">
    function PitzpalApp() {
        const [view, setView] = React.useState('lobby'); // 'lobby', 'rules', 'game'
        const [gameSetup, setGameSetup] = React.useState({ name: 'classic_one', level: 'easy' });
        const [rulesContent, setRulesContent] = React.useState('');
        const [gameId, setGameId] = React.useState(null);
        const [boardData, setBoardData] = React.useState(null);
        const [moves, setMoves] = React.useState([]);
        const [currentRound, setCurrentRound] = React.useState(1);
        const [animatedPit, setAnimatedPit] = React.useState(null);
        const [floatingAlert, setFloatingAlert] = React.useState(null);
        const [isAnimating, setIsAnimating] = React.useState(false);

        const currentUsername = "{{ user.username }}";

        const playSound = (type) => {
            try {
                if (type === 'drop') {
                    // Water drop sound set to 0.05 seconds with a crisp pitch drop
                    playSynthTone(1200, 'sine', 0.05, 500);
                } else if (type === 'moveToStore') {
                    playSynthTone(440, 'sine', 0.08);
                } else if (type === 'pasu') {
                    playSynthTone(300, 'triangle', 0.12);
                } else if (type === 'capture') {
                    playSynthTone(587.33, 'sine', 0.1);
                } else if (type === 'doubleCapture') {
                    playSynthTone(880, 'sine', 0.15);
                } else if (type === 'win') {
                    playSynthTone(523.25, 'sine', 0.2);
                } else if (type === 'lose') {
                    playSynthTone(220, 'sawtooth', 0.2);
                }
            } catch (e) {
                console.log("Audio synthesis prevented", e);
            }
        };

        const handleOpenRules = async () => {
            setView('rules');
            try {
                const res = await fetch(`/doc/${gameSetup.name}_${gameSetup.level}`);
                const text = await res.text();
                setRulesContent(text);
            } catch (err) {
                setRulesContent('<p class="text-danger">Failed to load rules.</p>');
            }
        };

        const submitNewGame = async () => {
            setView('game');
            try {
                const res = await fetch('{% url "api_new_game" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        Name: { Value: gameSetup.name },
                        Level: { Value: gameSetup.level },
                        Players: [currentUsername, "Computer"]
                    })
                });
                const data = await res.json();
                if (data.GameID) {
                    setGameId(data.GameID);
                    loadBoard(data.GameID);
                }
            } catch (e) {
                console.error(e);
            }
        };

        const loadBoard = async (id) => {
            try {
                const res = await fetch(`/game/${id}/refresh`);
                const data = await res.json();
                setBoardData(data);
                if (data.Moves) setMoves(data.Moves);

                if (data.Status === "done") {
                    checkGameOverSounds(data);
                    return;
                }

                if (data.Status !== "toss") {
                    const currentTurn = data.Board ? data.Board.Turn : 0;
                    const myData = data.Toss ? data.Toss.find(p => p.Player === currentUsername) : null;
                    const mySide = myData ? myData.Side : null;

                    if (currentTurn !== mySide) {
                        setTimeout(() => triggerUrMove(id), 2000);
                    }
                }
            } catch (err) {
                console.error("Failed to load board:", err);
            }
        };

        const checkGameOverSounds = (data) => {
            let scores = {};
            if (data.Board?.Store) {
                data.Board.Store.forEach(st => {
                    const [[side, val]] = Object.entries(st);
                    scores[side] = parseInt(val, 10);
                });
            }
            const score0 = scores["0"] || 0;
            const score1 = scores["1"] || 0;
            if (score0 >= score1) playSound('win');
            else playSound('lose');
        };

        const handleToss = async () => {
            try {
                const res = await fetch(`/game/${gameId}/toss`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });
                if (res.ok) loadBoard(gameId);
            } catch (e) {
                console.error("Toss failed:", e);
            }
        };

        const animateMoveDetails = async (details) => {
            if (!details || details.length === 0) return;
            setIsAnimating(true);

            for (const step of details) {
                if ("RoundUp" in step) {
                    setCurrentRound(step.Nrounds);
                }
                // If the step updates a pit's value, update boardData state live
                if ("Index" in step && "Value" in step) {
                    setBoardData(prevData => {
                        if (!prevData || !prevData.Board || !prevData.Board.Pits) return prevData;
                            const updatedPits = prevData.Board.Pits.map(pit => {
                                if (pit.Index === step.Index) {
                                      return { ...pit, Value: step.Value };
                                }
                                return pit;
                            });
                        return {
                            ...prevData,
                            Board: {
                                ...prevData.Board,
                                Pits: updatedPits
                            }
                        };
                    });
                }
                if ("Store" in step) {
                    playSound('moveToStore');
                    setBoardData(prevData => {
                                            if (!prevData || !prevData.Board || !prevData.Board.Store) return prevData;

                                            const storeEntries = Object.entries(step.Store);
                                            if (storeEntries.length === 0) return prevData;
                                            const [targetSide, targetVal] = storeEntries[0];

                                            const updatedStore = prevData.Board.Store.map(st => {
                                                const [[side, val]] = Object.entries(st);
                                                if (side === targetSide) {
                                                    return { [side]: targetVal };
                                                }
                                                return st;
                                            });

                                            return {
                                                ...prevData,
                                                Board: {
                                                    ...prevData.Board,
                                                    Store: updatedStore
                                                }
                                            };
                                        });
                                        await new Promise(r => setTimeout(r, 150));
                } else if ("Pasu" in step) {
                    playSound('pasu');
                    setFloatingAlert(`🍯 Pasu Collected: ${step.PasuCount || ''}`);
                    await new Promise(r => setTimeout(r, 600));
                    setFloatingAlert(null);
                } else if ("Index" in step) {
                    setAnimatedPit(step.Index);
                    playSound('drop');
                    await new Promise(r => setTimeout(r, 200)); // slightly extended delay to cleanly hear each drop
                    setAnimatedPit(null);
                }

                if ("Capture" in step) {
                    const seedCount = step.CaptureCount || 0;
                    const isDouble = step.IsDoubleCapture || false;
                    setFloatingAlert(isDouble ? `🐝 Double Capture! (${seedCount} seeds)` : `🐝 Captured ${seedCount} seeds!`);
                    playSound(isDouble ? 'doubleCapture' : 'capture');
                    await new Promise(r => setTimeout(r, 800));
                    setFloatingAlert(null);
                }
            }
            setIsAnimating(false);
        };

        const submitMove = async (pitIndex) => {
            if (isAnimating) return;
            try {
                const seq = moves.length > 0 ? moves[moves.length - 1].Move.Sequence : 1;
                const payload = {
                    GameID: gameId,
                    Move: {
                        Sequence: seq + 1,
                        Timestamp: new Date().toISOString(),
                        Player: currentUsername,
                        Index: pitIndex
                    }
                };
                const res = await fetch(`/game/${gameId}/mymove`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const resp = await res.json();
                    if (resp.Detail) await animateMoveDetails(resp.Detail);
                    loadBoard(gameId);
                }
            } catch (e) {
                console.error(e);
            }
        };

        const triggerUrMove = async (id) => {
            try {
                const res = await fetch(`/game/${id}/urmove`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ GameID: id })
                });
                if (res.ok) {
                    const resp = await res.json();
                    if (resp.Detail) await animateMoveDetails(resp.Detail);
                    loadBoard(id);
                }
            } catch (e) {
                console.error("Computer move error:", e);
            }
        };

        const triggerResign = async () => {
            try {
                const res = await fetch(`/game/${gameId}/resign`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ GameID: gameId })
                });
                if (res.ok) loadBoard(gameId);
            } catch (e) {
                console.error("Resign error:", e);
            }
        };

        return (
            <div className="container py-4" style={ { backgroundColor: '#fffdf4', minHeight: '80vh', borderRadius: '12px' } }>
                <h2 className="text-center fw-bold mb-4" style={ { color: '#d97706' } }>🍯 Honeycomb Pitzpal Arena</h2>

                {/* Floating Notification Alerts */}
                {floatingAlert && (
                    <div className="alert alert-warning text-center position-fixed top-50 start-50 translate-middle shadow-lg fs-3 fw-bold" style={ { zIndex: 1050, borderRadius: '25px', border: '3px solid #f59e0b', backgroundColor: '#fef3c7', color: '#78350f' } }>
                        {floatingAlert}
                    </div>
                )}

                {/* Lobby View */}
                {view === 'lobby' && (
                    <div className="card shadow p-4 mx-auto" style={ { maxWidth: '500px', borderRadius: '15px' } }>
                        <h4 className="mb-3">Welcome, {{ user.username }}!</h4>
                        <div className="mb-3">
                            <label className="form-label">Game Mode</label>
                            <select className="form-select" onChange={e => setGameSetup({...gameSetup, name: e.target.value})}>
                                <option value="classic_one">Classic Standard</option>
                                <option value="classic_kingz">Classic Premium</option>
                            </select>
                        </div>
                        <div className="mb-3">
                            <label className="form-label">Difficulty</label>
                            <select className="form-select" onChange={e => setGameSetup({...gameSetup, level: e.target.value})}>
                                <option value="easy">Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                        <button className="btn btn-warning w-100 fw-bold text-dark shadow-sm py-2" onClick={handleOpenRules}>
                            Create New Game & View Rules
                        </button>
                    </div>
                )}

                {/* Rules Modal View */}
                {view === 'rules' && (
                    <div className="card shadow p-4 mx-auto" style={ { maxWidth: '800px' } }>
                        <h5>Game Rules & Conditions</h5>
                        <div className="my-3 p-3 border rounded bg-light" dangerouslySetInnerHTML={ { __html: rulesContent } } />
                        <div className="text-end">
                            <button className="btn btn-secondary me-2" onClick={() => setView('lobby')}>Decline</button>
                            <button className="btn btn-success" onClick={submitNewGame}>Accept & Start</button>
                        </div>
                    </div>
                )}

                {/* Active Game / Toss / GameOver View */}
                {view === 'game' && boardData && (
                    <div className="card border-dark shadow">
                        <div className="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <span>Game ID: <strong className="text-warning">{gameId}</strong></span>
                            <span className="badge bg-warning text-dark fs-6 px-3 py-2">Current Round: {currentRound}</span>
                            {boardData.Status !== "done" && boardData.Status !== "toss" && (
                                <button className="btn btn-warning btn-sm" onClick={triggerResign} disabled={isAnimating}>
                                    Resign
                                </button>
                            )}
                        </div>
                        <div className="card-body">
                            {boardData.Status === "toss" ? (
                                <div className="text-center p-5 border rounded bg-light shadow-sm w-100">
                                    <h2 className="mb-4">Ready to play?</h2>
                                    <p className="text-muted">Click the button to decide who moves first!</p>
                                    <button className="btn btn-warning btn-lg px-5 py-3 shadow" onClick={handleToss}>
                                        <i className="bi bi-coin"></i> TOSS
                                    </button>
                                </div>
                            ) : boardData.Status === "done" ? (
                                <div className="text-center p-4">
                                    <h2 className="display-6 fw-bold text-success mb-3">🎉 Game Concluded!</h2>
                                    <button className="btn btn-primary btn-lg" onClick={() => window.location.reload()}>
                                        Return to Lobby
                                    </button>
                                </div>
                            ) : (
                                <div className="row">
                                    {/* Sidebar: History & Store */}
                                    <div className="col-md-3 border-end">
                                        <h6>Move History</h6>
                                        <div style={ { height: '250px', overflowY: 'auto', fontSize: '0.9rem' } } className="border rounded p-2 mb-3 bg-light">
                                            {moves.length === 0 ? <div className="text-muted text-center small">No moves yet</div> :
                                                moves.map((m, idx) => (
                                                    <div key={idx} className="border-bottom py-1 d-flex justify-content-between">
                                                        <span className={m.Move.Player === currentUsername ? 'text-primary fw-bold' : 'text-danger'}>
                                                            {m.Move.Player === currentUsername ? 'You' : 'Computer'} (Pit {m.Move.Index})
                                                        </span>
                                                        <span className="badge bg-secondary">#{m.Move.Sequence}</span>
                                                    </div>
                                                ))
                                            }
                                        </div>
                                        <h6>Store Values</h6>
                                        <div className="alert alert-info py-2">
                                            {boardData.Board?.Store?.map((st, i) => {
                                                const [[side, val]] = Object.entries(st);
                                                return <div key={i}>Side {side}: <strong>{val}</strong></div>;
                                            })}
                                        </div>
                                    </div>

                                    {/* Main Honeycomb Game Board */}
                                    <div className="col-md-9 text-center">
                                        <style>{`
                                            .honeycomb-pit {
                                                width: 80px;
                                                height: 92px;
                                                background-color: #fef08a;
                                                margin: 12px 8px;
                                                display: inline-flex;
                                                flex-direction: column;
                                                align-items: center;
                                                justify-content: center;
                                                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                                                cursor: pointer;
                                                transition: transform 0.15s, background-color 0.15s;
                                                border: none;
                                                position: relative;
                                                overflow: hidden;
                                            }
                                            .honeycomb-pit:hover:not(:disabled) {
                                                background-color: #fde047;
                                                transform: scale(1.08);
                                            }
                                            .honeycomb-pit.animated-glow {
                                                background-color: #f59e0b !important;
                                                transform: scale(1.18);
                                                box-shadow: 0 0 20px #d97706;
                                            }
                                            .honeycomb-pit:disabled {
                                                cursor: not-allowed;
                                                opacity: 0.65;
                                            }
                                            /* Inactive pits hidden */
                                            .honeycomb-pit-inactive {
                                                visibility: hidden;
                                                pointer-events: none;
                                                width: 80px;
                                                height: 92px;
                                                margin: 12px 8px;
                                                display: inline-block;
                                            }
                                            /* Liquid honey fill effect at the bottom */
                                            .liquid-level {
                                                position: absolute;
                                                bottom: 0;
                                                left: 0;
                                                right: 0;
                                                background: linear-gradient(to top, #fde047, #f59e0b);
                                                opacity: 0.9;
                                                transition: height 0.2s ease;
                                                z-index: 1;
                                                pointer-events: none;
                                            }
                                            .pit-content {
                                                position: relative;
                                                z-index: 2;
                                            }
                                            /* Side Banner Styling for Ownership & Active Turn */
                                            .side-banner {
                                                border-radius: 8px;
                                                transition: all 0.3s ease;
                                            }
                                            .side-banner.active-turn {
                                                border: 2px solid #f59e0b;
                                                box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
                                                background-color: #fffbeb !important;
                                            }
                                        `}</style>

                                        <div className="card p-4 shadow-sm bg-white">
                                            {(() => {
                                                const currentTurn = boardData.Board ? boardData.Board.Turn : 0;

                                                const pitsMap = {};
                                                boardData.Board.Pits.forEach(pit => {
                                                    pitsMap[pit.Side] = pitsMap[pit.Side] || [];
                                                    pitsMap[pit.Side].push(pit);
                                                });

                                                return Object.entries(pitsMap).map(([sideId, pits]) => {
                                                    const sideNumber = Number(sideId);
                                                    const sortedPits = sideNumber % 2 !== 0 ? [...pits].reverse() : pits;

                                                    const tossEntry = boardData.Toss ? boardData.Toss.find(p => p.Side === sideNumber) : null;
                                                    const ownerName = tossEntry ? tossEntry.Player : `Side ${sideNumber}`;
                                                    const isThisSideActive = (currentTurn === sideNumber);

                                                    return (
                                                        <div
                                                            key={sideId}
                                                            className={`side-banner p-2 my-3 ${isThisSideActive ? 'active-turn' : 'bg-light'}`}
                                                        >
                                                            <div className="d-flex justify-content-between align-items-center px-3 mb-1">
                                                                <span className="fw-bold small" style={ { color: '#78350f' } }>
                                                                    👤 Owner: {ownerName} {ownerName === currentUsername ? '(You)' : ''}
                                                                </span>
                                                                <span className={`badge ${isThisSideActive ? 'bg-warning text-dark' : 'bg-secondary'}`}>
                                                                    {isThisSideActive ? '⚡ Active Turn' : 'Waiting'}
                                                                </span>
                                                            </div>

                                                            <div className="d-flex justify-content-center flex-wrap">
                                                                {sortedPits.map(pit => {
                                                                    if (pit.Active === false) {
                                                                        return <div key={pit.Index} className="honeycomb-pit-inactive"></div>;
                                                                    }

                                                                    const myData = boardData.Toss ? boardData.Toss.find(p => p.Player === currentUsername) : null;
                                                                    const myside = myData ? myData.Side : null;
                                                                    const isMyTurn = (currentTurn === myside && sideNumber === myside && pit.Value > 0 && !pit.Public && !isAnimating);

                                                                    const fillHeightPercent = Math.min(Math.max(pit.Value * 5, pit.Value > 0 ? 12 : 0), 100);

                                                                    return (
                                                                        <button
                                                                            key={pit.Index}
                                                                            className={`honeycomb-pit ${animatedPit === pit.Index ? 'animated-glow' : ''}`}
                                                                            disabled={!isMyTurn}
                                                                            onClick={() => submitMove(pit.Index)}
                                                                        >
                                                                            <div className="liquid-level" style={ { height: `${fillHeightPercent}%` } }></div>
                                                                            <div className="pit-content">
                                                                                <span style={ { fontSize: '0.65rem', color: '#78350f', fontWeight: 'bold' } }>Pit {pit.Index}</span>
                                                                                <span className="fw-bold d-block" style={ { fontSize: '0.95rem', color: '#451a03' } }>{pit.Value}</span>
                                                                            </div>
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                            })()}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('react-pitzpal-root')).render(<PitzpalApp />);
</script>
{% endblock %}
