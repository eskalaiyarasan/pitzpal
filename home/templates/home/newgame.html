{% extends 'common/base.html' %}
{% load i18n %}
{% block title %} {% trans "New Game" %} {% endblock %}

{% block content %}
<!-- Load React, ReactDOM, and Babel via CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Mount point for React -->
<div id="react-pitzpal-root"></div>

<!-- Audio Synthesizer using Web Audio API for crisp, single-tone, ultra-short sounds -->
<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSynthTone(frequency, type, duration, pitchEnd = null) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        if (pitchEnd !== null) {
            osc.frequency.exponentialRampToValueAtTime(pitchEnd, audioCtx.currentTime + duration);
        }

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
</script>

<!-- React Application Code -->
<script type="text/babel">
    function PitzpalApp() {
        const [view, setView] = React.useState('lobby'); // 'lobby', 'rules', 'game'
        const [gameSetup, setGameSetup] = React.useState({ name: 'classic_one', level: 'easy' });
        const [ruleStep, setRuleStep] = React.useState(1);
        const maxRules = 21;

        const [gameId, setGameId] = React.useState(null);
        const [boardData, setBoardData] = React.useState(null);
        const [moves, setMoves] = React.useState([]);
        const [currentRound, setCurrentRound] = React.useState(1);
        const [animatedPit, setAnimatedPit] = React.useState(null);
        const [floatingAlert, setFloatingAlert] = React.useState(null);
        const [isAnimating, setIsAnimating] = React.useState(false);

        const currentUsername = "{{ user.username }}";

        const playSound = (type) => {
            try {
                if (type === 'drop') {
                    playSynthTone(1200, 'sine', 0.05, 500);
                } else if (type === 'moveToStore') {
                    playSynthTone(440, 'sine', 0.08);
                } else if (type === 'pasu') {
                    playSynthTone(300, 'triangle', 0.12);
                } else if (type === 'capture') {
                    playSynthTone(587.33, 'sine', 0.1);
                } else if (type === 'doubleCapture') {
                    playSynthTone(880, 'sine', 0.15);
                } else if (type === 'win') {
                    playSynthTone(523.25, 'sine', 0.2);
                } else if (type === 'lose') {
                    playSynthTone(220, 'sawtooth', 0.2);
                }
            } catch (e) {
                console.log("Audio synthesis prevented", e);
            }
        };

        const handleOpenRules = async () => {
            setView('rules');
            setRuleStep(1);
        };

        const submitNewGame = async () => {
            setView('game');
            try {
                const res = await fetch('{% url "api_new_game" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        Name: { Value: gameSetup.name },
                        Level: { Value: gameSetup.level },
                        Players: [currentUsername, "Computer"]
                    })
                });
                const data = await res.json();
                if (data.GameID) {
                    setGameId(data.GameID);
                    loadBoard(data.GameID);
                }
            } catch (e) {
                console.error(e);
            }
        };

        const loadBoard = async (id) => {
            try {
                const res = await fetch(`/game/${id}/refresh`);
                const data = await res.json();
                setBoardData(data);
                if (data.Moves) setMoves(data.Moves);

                if (data.Status === "done") {
                    checkGameOverSounds(data);
                    return;
                }

                if (data.Status !== "toss") {
                    const currentTurn = data.Board ? data.Board.Turn : 0;
                    const myData = data.Toss ? data.Toss.find(p => p.Player === currentUsername) : null;
                    const mySide = myData ? myData.Side : null;

                    if (currentTurn !== mySide) {
                        setTimeout(() => triggerUrMove(id), 2000);
                    }
                }
            } catch (err) {
                console.error("Failed to load board:", err);
            }
        };

        const checkGameOverSounds = (data) => {
            let scores = {};
            if (data.Board?.Store) {
                data.Board.Store.forEach(st => {
                    const [[side, val]] = Object.entries(st);
                    scores[side] = parseInt(val, 10);
                });
            }
            const score0 = scores["0"] || 0;
            const score1 = scores["1"] || 0;
            if (score0 >= score1) playSound('win');
            else playSound('lose');
        };

        const handleToss = async () => {
            try {
                const res = await fetch(`/game/${gameId}/toss`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });
                if (res.ok) loadBoard(gameId);
            } catch (e) {
                console.error("Toss failed:", e);
            }
        };

        const animateMoveDetails = async (details) => {
            if (!details || details.length === 0) return;
            setIsAnimating(true);

            for (const step of details) {
                if ("RoundUp" in step) {
                    setCurrentRound(step.Nrounds);
                }
                if ("Index" in step && "Value" in step) {
                    setBoardData(prevData => {
                        if (!prevData || !prevData.Board || !prevData.Board.Pits) return prevData;
                        const updatedPits = prevData.Board.Pits.map(pit => {
                            if (pit.Index === step.Index) {
                                return { ...pit, Value: step.Value };
                            }
                            return pit;
                        });
                        return {
                            ...prevData,
                            Board: {
                                ...prevData.Board,
                                Pits: updatedPits
                            }
                        };
                    });
                }
                if ("Store" in step) {
                    playSound('moveToStore');
                    setBoardData(prevData => {
                        if (!prevData || !prevData.Board || !prevData.Board.Store) return prevData;

                        const storeEntries = Object.entries(step.Store);
                        if (storeEntries.length === 0) return prevData;
                        const [targetSide, targetVal] = storeEntries[0];

                        const updatedStore = prevData.Board.Store.map(st => {
                            const [[side, val]] = Object.entries(st);
                            if (side === targetSide) {
                                return { [side]: targetVal };
                            }
                            return st;
                        });

                        return {
                            ...prevData,
                            Board: {
                                ...prevData.Board,
                                Store: updatedStore
                            }
                        };
                    });
                    await new Promise(r => setTimeout(r, 150));
                } else if ("Pasu" in step) {
                    playSound('pasu');
                    setFloatingAlert(`Pasu Collected: ${step.PasuCount || ''}`);
                    await new Promise(r => setTimeout(r, 600));
                    setFloatingAlert(null);
                } else if ("Index" in step) {
                    setAnimatedPit(step.Index);
                    playSound('drop');
                    await new Promise(r => setTimeout(r, 200));
                    setAnimatedPit(null);
                }

                if ("Capture" in step) {
                    const seedCount = step.CaptureCount || 0;
                    const isDouble = step.IsDoubleCapture || false;
                    setFloatingAlert(isDouble ? `Double Capture! (${seedCount} seeds)` : `Captured ${seedCount} seeds!`);
                    playSound(isDouble ? 'doubleCapture' : 'capture');
                    await new Promise(r => setTimeout(r, 800));
                    setFloatingAlert(null);
                }
            }
            setIsAnimating(false);
        };

        const submitMove = async (pitIndex) => {
            if (isAnimating) return;
            try {
                const seq = moves.length > 0 ? moves[moves.length - 1].Move.Sequence : 1;
                const payload = {
                    GameID: gameId,
                    Move: {
                        Sequence: seq + 1,
                        Timestamp: new Date().toISOString(),
                        Player: currentUsername,
                        Index: pitIndex
                    }
                };
                const res = await fetch(`/game/${gameId}/mymove`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const resp = await res.json();
                    if (resp.Detail) await animateMoveDetails(resp.Detail);
                    loadBoard(gameId);
                }
            } catch (e) {
                console.error(e);
            }
        };

        const triggerUrMove = async (id) => {
            try {
                const res = await fetch(`/game/${id}/urmove`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ GameID: id })
                });
                if (res.ok) {
                    const resp = await res.json();
                    if (resp.Detail) await animateMoveDetails(resp.Detail);
                    loadBoard(id);
                }
            } catch (e) {
                console.error("Computer move error:", e);
            }
        };

        const triggerResign = async () => {
            try {
                const res = await fetch(`/game/${gameId}/resign`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ GameID: gameId })
                });
                if (res.ok) loadBoard(gameId);
            } catch (e) {
                console.error("Resign error:", e);
            }
        };

        return (
            <div className="container py-4" style={ { backgroundColor: '#fffdf4', minHeight: '80vh', borderRadius: '12px' } }>
                <h2 className="text-center fw-bold mb-4" style={ { color: '#d97706' } }>Honeycomb Pitzpal Arena</h2>

                {/* Floating Notification Alerts */}
                {floatingAlert && (
                    <div className="alert alert-warning text-center position-fixed top-50 start-50 translate-middle shadow-lg fs-3 fw-bold" style={ { zIndex: 1050, borderRadius: '25px', border: '3px solid #f59e0b', backgroundColor: '#fef3c7', color: '#78350f' } }>
                        {floatingAlert}
                    </div>
                )}

                {/* Lobby View */}
                {view === 'lobby' && (
                    <div className="card shadow p-4 mx-auto" style={ { maxWidth: '500px', borderRadius: '15px' } }>
                        <h4 className="mb-3">Welcome, {{ user.username }}!</h4>
                        <div className="mb-3">
                            <label className="form-label">Game Mode</label>
                            <select className="form-select" onChange={e => setGameSetup({...gameSetup, name: e.target.value})}>
                                <option value="classic_one">Classic Standard</option>
                                <option value="classic_kingz">Classic Premium</option>
                            </select>
                        </div>
                        <div className="mb-3">
                            <label className="form-label">Difficulty</label>
                            <select className="form-select" onChange={e => setGameSetup({...gameSetup, level: e.target.value})}>
                                <option value="easy">Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                        <button className="btn btn-warning w-100 fw-bold text-dark shadow-sm py-2" onClick={handleOpenRules}>
                            Create New Game & View Rules
                        </button>
                    </div>
                )}

                {/* Rules Walkthrough View with Hexagonal Rule Pits */}
                {view === 'rules' && (
                    <div className="card shadow p-4 mx-auto text-center" style={ { maxWidth: '680px', borderRadius: '15px' } }>
                        <style>{`
                            .rule-honeycomb-pit {
                                width: 72px;
                                height: 83px;
                                background-color: #fef08a;
                                margin: 6px;
                                display: inline-flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                                position: relative;
                                border: none;
                            }
                            .rule-honeycomb-pit.silver-pit {
                                background-color: #fef08a !important;
                                border: 3px solid #94a3b8 !important;
                                filter: drop-shadow(0 0 4px rgba(148, 163, 184, 0.9));
                            }
                            .rule-honeycomb-pit.crossed-pit::after {
                                content: "❌";
                                position: absolute;
                                top: 50%;
                                left: 50%;
                                transform: translate(-50%, -50%);
                                font-size: 1.2rem;
                                z-index: 3;
                            }
                        `}</style>

                        <div className="d-flex justify-content-between align-items-center mb-3">
                            <h4 className="fw-bold m-0" style={ { color: '#d97706', fontSize: '1.1rem' } }>Game: {gameSetup.name} - {gameSetup.level}</h4>
                            <button className="btn btn-outline-secondary btn-sm" onClick={submitNewGame}>Skip Rules</button>
                        </div>

                        {/* Visual Step Container */}
                        <div className="my-3 p-4 border rounded bg-white shadow-sm d-flex flex-column align-items-center justify-content-center" style={ { minHeight: '240px' } }>

                            {/* Rule 1 */}
                            {ruleStep === 1 && (
                                <div>
                                    <div className="d-flex justify-content-center gap-4 mb-3">
                                        <div className="p-3 bg-warning text-dark rounded-circle fw-bold shadow-sm" style={ { width: '60px', height: '60px', display: 'flex', alignItems: 'center', justifyContent: 'center' } }>P1</div>
                                        <div className="p-3 bg-danger text-white rounded-circle fw-bold shadow-sm" style={ { width: '60px', height: '60px', display: 'flex', alignItems: 'center', justifyContent: 'center' } }>P2</div>
                                    </div>
                                    <h5 className="fw-bold text-dark mt-2">Rule 1: This is a 2-player game.</h5>
                                    <p className="text-muted small">Face off against your opponent in a tactical battle of wits.</p>
                                </div>
                            )}

                            {/* Rule 2 */}
                            {ruleStep === 2 && (
                                <div className="w-100">
                                    <div className="d-flex justify-content-around bg-light p-2 rounded mb-3 border">
                                        <div className="text-primary fw-bold">Side 0</div>
                                        <div className="text-danger fw-bold">Side 1</div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 2: The board consists of 2 rows/sides.</h5>
                                    <p className="text-muted small">Side 0 and Side 1 are clearly mapped across the playing board.</p>
                                </div>
                            )}

                            {/* Rule 3 */}
                            {ruleStep === 3 && (
                                <div>
                                    <div className="fs-1 mb-2">🪙</div>
                                    <h5 className="fw-bold text-dark">Rule 3: Coin Toss Determination</h5>
                                    <p className="text-muted small">A coin toss is used to determine who chooses their side.</p>
                                </div>
                            )}

                            {/* Rule 4 */}
                            {ruleStep === 4 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-2 mb-2">
                                        <span className="badge bg-success">Toss Winner</span>
                                        <span>➔</span>
                                        <span className="badge bg-primary">Gets Side 0 & Opens Play</span>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 4: Opening Move</h5>
                                    <p className="text-muted small">The player winning the toss gets Side 0 and starts the play.</p>
                                </div>
                            )}

                            {/* Rule 5 */}
                            {ruleStep === 5 && (
                                <div className="w-100">
                                    <div className="d-flex justify-content-center align-items-center gap-2 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>4</span>
                                        </div>
                                        <div className="rule-honeycomb-pit crossed-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>0</span>
                                        </div>
                                        <div className="rule-honeycomb-pit silver-pit crossed-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>KingPit</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>—</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 5: Valid Move Selection</h5>
                                    <p className="text-muted small">Select a non-empty pit. Empty pits (0 value) and King's pits show a cross mark indicating they cannot be chosen.</p>
                                </div>
                            )}

                            {/* Rule 6 */}
                            {ruleStep === 6 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-2 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit X</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>4</span>
                                        </div>
                                        <span className="fs-4 fw-bold">➔</span>
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit X</span>
                                            <span className="fw-bold text-danger" style={ { fontSize: '0.85rem' } }>0</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 6: Sowing Seeds</h5>
                                    <p className="text-muted small">All seeds from the selected pit are scooped out (leaving 0) and sowed consecutively.</p>
                                </div>
                            )}

                            {/* Rule 7 */}
                            {ruleStep === 7 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm" style={ { border: '2px solid #d97706' } }>
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>Drop</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-light">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold text-danger" style={ { fontSize: '0.7rem' } }>Scoop</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>3</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 7 & 8 (Part 1): Sowing & Scooping</h5>
                                    <p className="text-muted small">Dropping into the first pit, while taking out values from the middle consecutive pit to continue sowing.</p>
                                </div>
                            )}

                            {/* Rule 8 */}
                            {ruleStep === 8 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>1</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Empty</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm" style={ { border: '2px solid #d97706' } }>
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>Drop</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 8 (Part 2): Continuing to Third Pit</h5>
                                    <p className="text-muted small">Middle pit acts as empty, allowing the final drop to land in the third pit.</p>
                                </div>
                            )}

                            {/* Rule 9 & 10 */}
                            {ruleStep === 9 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>1</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Empty</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-success text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Collect</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 9 & 10: Standard Capture</h5>
                                    <p className="text-muted small">Drop into first pit, middle is empty, collect all from the third pit. <strong>Turn ends here.</strong></p>
                                </div>
                            )}

                            {/* Rule 10 */}
                            {ruleStep === 10 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>1</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Empty</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-light text-muted">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Empty</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 11 (Step 10): Empty Target Capture</h5>
                                    <p className="text-muted small">Drop into first pit, middle is empty, third pit is empty (taking out nothing). <strong>Turn ends here.</strong></p>
                                </div>
                            )}

                            {/* Rule 11: Accumulation Rule */}
                            {ruleStep === 11 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm border border-warning">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>Drop</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>3</span>
                                        </div>
                                        <span className="fs-5 fw-bold mx-1">➔</span>
                                        <div className="rule-honeycomb-pit shadow-sm bg-success text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Collect</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-warning text-dark">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Drop</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 11: Accumulation Rule</h5>
                                    <p className="text-muted small">Across 2 consecutive pits, drop at the first,if it has exact value == pasu value, then collect seeds from the first one by the owner of the pit and drop them at the second pit.</p>
                                </div>
                            )}

                            {/* Rule 12: Accumulation Bonus */}
                            {ruleStep === 12 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>2</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>0</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>4</span>
                                        </div>
                                        <span className="fs-5 fw-bold mx-1">➔</span>
                                        <div className="rule-honeycomb-pit shadow-sm bg-success text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 1 & 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.65rem' } }>Collect All</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 12: Accumulation Bonus</h5>
                                    <p className="text-muted small">Across 3 consecutive pits with the middle one at value 0, current turn active player collects seeds from the first and last one , if last drop fall on the first pit after that it has value == pasu rule and last one is nonempty. This overrides the standard Accumulation Rule.</p>
                                </div>
                            )}

                            {/* Rule 13: Dual Capture */}
                            {ruleStep === 13 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>3</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>0</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>0</span>
                                        </div>
                                        <span className="fs-5 fw-bold mx-1">➔</span>
                                        <div className="rule-honeycomb-pit shadow-sm bg-success text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.65rem' } }>Pit Owner Collect</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 13: Dual Capture</h5>
                                    <p className="text-muted small">Across 3 consecutive pits with the middle and last ones having value 0, collect seeds from the first pit by the pit owner.</p>
                                </div>
                            )}

                            {/* Rule 14: Restriction Dual Capture */}
                            {ruleStep === 14 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 1</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>1</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>Pit 2</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>0</span>
                                        </div>
                                        <div className="rule-honeycomb-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 3</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>5</span>
                                        </div>
                                        <span className="fs-5 fw-bold mx-1">➔</span>
                                        <div className="rule-honeycomb-pit shadow-sm bg-warning text-dark">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Pit 3 Only</span>
                                            <span className="fw-bold" style={ { fontSize: '0.65rem' } }>Collect Last</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 14: Restriction Dual Capture</h5>
                                    <p className="text-muted small">Across 3 consecutive pits where the middle is 0, the last has a non-zero value, and the first has a value of 1, collect seeds from the last pit alone. The first pit doesn't pass the accumulation rule.</p>
                                </div>
                            )}

                            {/* Rule 15: King's Pit Exception */}
                            {ruleStep === 15 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-2 mb-2">
                                        <div className="rule-honeycomb-pit silver-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>KingPit</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>👑</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 15: King's Pit Exception</h5>
                                    <p className="text-muted small">The Accumulation Rule, Accumulation Bonus, and Dual Capture Rule do not apply to King's Pits.</p>
                                </div>
                            )}

                            {/* Rule 16: Round Transition */}
                            {ruleStep === 16 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm bg-secondary text-white">
                                            <span style={ { fontSize: '0.55rem', color: '#fff', fontWeight: 'bold' } }>All Pits</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>0 (Empty)</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 16: Round Transition</h5>
                                    <p className="text-muted small">Triggered when current turn hits a state where all active pits are completely empty.</p>
                                </div>
                            )}

                            {/* Rule 17: Board Reset */}
                            {ruleStep === 17 && (
                                <div>
                                    <div className="fs-1 mb-2">🔄</div>
                                    <h5 className="fw-bold text-dark">Rule 17: Board Reset</h5>
                                    <p className="text-muted small">Initiate a roundup and take the seeds to refill the pits across all rows for the next phase of the game.</p>
                                </div>
                            )}

                            {/* Rule 18: Game Over */}
                            {ruleStep === 18 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="d-flex gap-1">
                                            <div className="rule-honeycomb-pit shadow-sm bg-warning"><span className="fw-bold" style={ { fontSize: '0.7rem' } }>3</span></div>
                                            <div className="rule-honeycomb-pit shadow-sm bg-warning"><span className="fw-bold" style={ { fontSize: '0.7rem' } }>2</span></div>
                                            <div className="rule-honeycomb-pit shadow-sm bg-warning"><span className="fw-bold" style={ { fontSize: '0.7rem' } }>4</span></div>
                                            <div className="rule-honeycomb-pit shadow-sm bg-warning"><span className="fw-bold" style={ { fontSize: '0.7rem' } }>1</span></div>
                                            <div className="rule-honeycomb-pit shadow-sm bg-warning"><span className="fw-bold" style={ { fontSize: '0.7rem' } }>3</span></div>
                                        </div>
                                    </div>
                                    <div className="text-primary small fw-bold mb-1">Side 0: 5 Full Pits (Active)</div>
                                    <div className="text-danger small fw-bold mb-2">Side 1: No Pits / Insufficient Seeds (Game Over)</div>
                                    <h5 className="fw-bold text-dark">Rule 18: Game Over</h5>
                                    <p className="text-muted small">During round transition, any player not having enough at least to fill a pit results in game over.</p>
                                </div>
                            )}

                            {/* Rule 19: Sowing Limit */}
                            {ruleStep === 19 && (
                                <div>
                                    <div className="d-flex justify-content-center align-items-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit shadow-sm border border-warning">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>Normal</span>
                                            <span className="fw-bold" style={ { fontSize: '0.85rem', color: '#451a03' } }>Drop</span>
                                        </div>
                                        <div className="rule-honeycomb-pit silver-pit shadow-sm bg-light">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>King'z</span>
                                            <span className="fw-bold text-danger" style={ { fontSize: '0.7rem' } }>Scoop X</span>
                                        </div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 19: Sowing Limit</h5>
                                    <p className="text-muted small">During sowing, if the last drop is in a pit just before a King's pit, the turn ends there with a scoop action on the King's pit.</p>
                                </div>
                            )}

                            {/* Rule 20: Fractional Capture */}
                            {ruleStep === 20 && (
                                <div>
                                    <div className="d-flex align-items-center justify-content-center gap-1 mb-2">
                                        <div className="rule-honeycomb-pit silver-pit shadow-sm">
                                            <span style={ { fontSize: '0.55rem', color: '#78350f', fontWeight: 'bold' } }>KingPit</span>
                                            <span className="fw-bold" style={ { fontSize: '0.7rem' } }>Share 3:1</span>
                                        </div>
                                        <span className="fs-5 fw-bold mx-1">➔</span>
                                        <div className="badge bg-primary p-2">Side 0 (3) / Side 1 (1)</div>
                                    </div>
                                    <h5 className="fw-bold text-dark">Rule 20: Fractional Capture</h5>
                                    <p className="text-muted small">King's pit cannot be captured like normal pits, but we get a share for the captured count during round end (round transition) which is not carry-forwarded.</p>
                                </div>
                            )}

                            {/* Rule 21: Final Acceptance Step */}
                            {ruleStep === 21 && (
                                <div>
                                    <div className="fs-1 mb-2">👑</div>
                                    <h5 className="fw-bold text-dark">Final Rule Check & Acceptance</h5>
                                    <p className="text-muted small">Review all mechanics including fractional shares, sowing limits, and game over conditions. Click Accept below to proceed into the arena.</p>
                                </div>
                            )}

                        </div>

                        <div className="text-muted small mb-3">Rule Step {ruleStep} of {maxRules}</div>

                        {/* Navigation Footer */}
                        <div className="d-flex justify-content-between align-items-center">
                            <button
                                className="btn btn-outline-secondary px-4"
                                disabled={ruleStep === 1}
                                onClick={() => setRuleStep(prev => Math.max(prev - 1, 1))}
                            >
                                Back
                            </button>

                            {ruleStep < maxRules ? (
                                <button
                                    className="btn btn-warning px-4 fw-bold text-dark shadow-sm"
                                    onClick={() => setRuleStep(prev => Math.min(prev + 1, maxRules))}
                                >
                                    Next
                                </button>
                            ) : (
                                <button
                                    className="btn btn-success px-4 fw-bold shadow"
                                    onClick={submitNewGame}
                                >
                                    Accept & Proceed
                                </button>
                            )}
                        </div>
                    </div>
                )}

                {/* Active Game / Toss / GameOver View */}
                {view === 'game' && boardData && (
                    <div className="card border-dark shadow">
                        <div className="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <span>Game ID: <strong className="text-warning">{gameId}</strong></span>
                            <span className="badge bg-warning text-dark fs-6 px-3 py-2">Current Round: {currentRound}</span>
                            {boardData.Status !== "done" && boardData.Status !== "toss" && (
                                <button className="btn btn-warning btn-sm" onClick={triggerResign} disabled={isAnimating}>
                                    Resign
                                </button>
                            )}
                        </div>
                        <div className="card-body">
                            {boardData.Status === "toss" ? (
                                <div className="text-center p-5 border rounded bg-light shadow-sm w-100">
                                    <h2 className="mb-4">Ready to play?</h2>
                                    <p className="text-muted">Click the button to decide who moves first!</p>
                                    <button className="btn btn-warning btn-lg px-5 py-3 shadow" onClick={handleToss}>
                                        <i className="bi bi-coin"></i> TOSS
                                    </button>
                                </div>
                            ) : boardData.Status === "done" ? (
                                <div className="text-center p-4">
                                    <h2 className="display-6 fw-bold text-success mb-3">Game Concluded!</h2>
                                    <button className="btn btn-primary btn-lg" onClick={() => window.location.reload()}>
                                        Return to Lobby
                                    </button>
                                </div>
                            ) : (
                                <div className="row">
                                    {/* Sidebar: History & Store */}
                                    <div className="col-md-3 border-end">
                                        <h6>Move History</h6>
                                        <div style={ { height: '250px', overflowY: 'auto', fontSize: '0.9rem' } } className="border rounded p-2 mb-3 bg-light">
                                            {moves.length === 0 ? <div className="text-muted text-center small">No moves yet</div> :
                                                moves.map((m, idx) => (
                                                    <div key={idx} className="border-bottom py-1 d-flex justify-content-between">
                                                        <span className={m.Move.Player === currentUsername ? 'text-primary fw-bold' : 'text-danger'}>
                                                            {m.Move.Player === currentUsername ? 'You' : 'Computer'} (Pit {m.Move.Index})
                                                        </span>
                                                        <span className="badge bg-secondary">#{m.Move.Sequence}</span>
                                                    </div>
                                                ))
                                            }
                                        </div>
                                        <h6>Store Values</h6>
                                        <div className="alert alert-info py-2">
                                            {boardData.Board?.Store?.map((st, i) => {
                                                const [[side, val]] = Object.entries(st);
                                                return <div key={i}>Side {side}: <strong>{val}</strong></div>;
                                            })}
                                        </div>
                                    </div>

                                    {/* Main Honeycomb Game Board */}
                                    <div className="col-md-9 text-center">
                                        <style>{`
                                            .honeycomb-pit {
                                                width: 80px;
                                                height: 92px;
                                                background-color: #fef08a;
                                                margin: 12px 8px;
                                                display: inline-flex;
                                                flex-direction: column;
                                                align-items: center;
                                                justify-content: center;
                                                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                                                cursor: pointer;
                                                transition: transform 0.15s, background-color 0.15s;
                                                border: none;
                                                position: relative;
                                                overflow: hidden;
                                            }
                                            .honeycomb-pit.silver-pit {
                                                background-color: #fef08a !important;
                                                border: 3px solid #94a3b8 !important;
                                                filter: drop-shadow(0 0 4px rgba(148, 163, 184, 0.9));
                                            }
                                            .honeycomb-pit:hover:not(:disabled) {
                                                background-color: #fde047;
                                                transform: scale(1.08);
                                            }
                                            .honeycomb-pit.animated-glow {
                                                background-color: #f59e0b !important;
                                                transform: scale(1.18);
                                                box-shadow: 0 0 20px #d97706;
                                            }
                                            .honeycomb-pit:disabled {
                                                cursor: not-allowed;
                                                opacity: 0.65;
                                            }
                                            /* Inactive pits hidden */
                                            .honeycomb-pit-inactive {
                                                visibility: hidden;
                                                pointer-events: none;
                                                width: 80px;
                                                height: 92px;
                                                margin: 12px 8px;
                                                display: inline-block;
                                            }
                                            /* Liquid honey fill effect at the bottom */
                                            .liquid-level {
                                                position: absolute;
                                                bottom: 0;
                                                left: 0;
                                                right: 0;
                                                background: linear-gradient(to top, #fde047, #f59e0b);
                                                opacity: 0.9;
                                                transition: height 0.2s ease;
                                                z-index: 1;
                                                pointer-events: none;
                                            }
                                            .pit-content {
                                                position: relative;
                                                z-index: 2;
                                            }
                                            /* Side Banner Styling for Ownership & Active Turn */
                                            .side-banner {
                                                border-radius: 8px;
                                                transition: all 0.3s ease;
                                            }
                                            .side-banner.active-turn {
                                                border: 2px solid #f59e0b;
                                                box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
                                                background-color: #fffbeb !important;
                                            }
                                        `}</style>

                                        <div className="card p-4 shadow-sm bg-white">
                                            {(() => {
                                                const currentTurn = boardData.Board ? boardData.Board.Turn : 0;

                                                const pitsMap = {};
                                                boardData.Board.Pits.forEach(pit => {
                                                    pitsMap[pit.Side] = pitsMap[pit.Side] || [];
                                                    pitsMap[pit.Side].push(pit);
                                                });

                                                return Object.entries(pitsMap).map(([sideId, pits]) => {
                                                    const sideNumber = Number(sideId);
                                                    const sortedPits = sideNumber % 2 !== 0 ? [...pits].reverse() : pits;

                                                    const tossEntry = boardData.Toss ? boardData.Toss.find(p => p.Side === sideNumber) : null;
                                                    const ownerName = tossEntry ? tossEntry.Player : `Side ${sideNumber}`;
                                                    const isThisSideActive = (currentTurn === sideNumber);

                                                    return (
                                                        <div
                                                            key={sideId}
                                                            className={`side-banner p-2 my-3 ${isThisSideActive ? 'active-turn' : 'bg-light'}`}
                                                        >
                                                            <div className="d-flex justify-content-between align-items-center px-3 mb-1">
                                                                <span className="fw-bold small" style={ { color: '#78350f' } }>
                                                                    Owner: {ownerName} {ownerName === currentUsername ? '(You)' : ''}
                                                                </span>
                                                                <span className={`badge ${isThisSideActive ? 'bg-warning text-dark' : 'bg-secondary'}`}>
                                                                    {isThisSideActive ? 'Active Turn' : 'Waiting'}
                                                                </span>
                                                            </div>

                                                            <div className="d-flex justify-content-center flex-wrap">
                                                                {sortedPits.map(pit => {
                                                                    if (pit.Active === false) {
                                                                        return <div key={pit.Index} className="honeycomb-pit-inactive"></div>;
                                                                    }

                                                                    const myData = boardData.Toss ? boardData.Toss.find(p => p.Player === currentUsername) : null;
                                                                    const myside = myData ? myData.Side : null;
                                                                    const isMyTurn = (currentTurn === myside && sideNumber === myside && pit.Value > 0 && !pit.Public && !isAnimating);

                                                                    const fillHeightPercent = Math.min(Math.max(pit.Value * 5, pit.Value > 0 ? 12 : 0), 100);

                                                                    return (
                                                                        <button
                                                                            key={pit.Index}
                                                                            className={`honeycomb-pit ${pit.Public ? 'silver-pit' : ''} ${animatedPit === pit.Index ? 'animated-glow' : ''}`}
                                                                            disabled={!isMyTurn}
                                                                            onClick={() => submitMove(pit.Index)}
                                                                        >
                                                                            <div className="liquid-level" style={ { height: `${fillHeightPercent}%` } }></div>
                                                                            <div className="pit-content">
                                                                                <span style={ { fontSize: '0.65rem', color: '#78350f', fontWeight: 'bold' } }>Pit {pit.Index}</span>
                                                                                <span className="fw-bold d-block" style={ { fontSize: '0.95rem', color: '#451a03' } }>{pit.Value}</span>
                                                                            </div>
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                            })()}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('react-pitzpal-root')).render(<PitzpalApp />);
</script>
{% endblock %}
