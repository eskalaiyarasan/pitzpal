{% extends 'common/base.html' %}
{% block title %} New Game{% endblock %}
{% block content %}
<div id="pitzpal-main-container">
    <h1>Welcome, {{ user.username }}!</h1>

    <div id="lobby-view" class="mt-4">
        <div class="d-grid gap-2 col-6">
            <button class="btn btn-primary btn-lg" type="button" onclick="toggleSetup()">
                <i class="bi bi-controller"></i> Create New Game
            </button>
        </div>

        <div id="game-setup" class="card mt-3 shadow-sm" style="display:none;">
            <div class="card-body">
                <h5 class="card-title">Game Settings</h5>
                <hr>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Game Mode</label>
                        <select id="game-name-select" class="form-select">
                            <option value="classic_one_pod">Classic One Pod</option>
                            <option value="classic_one_pro">Classic One Pro</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Difficulty</label>
                        <select id="level-select" class="form-select">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button class="btn btn-outline-secondary me-2" onclick="toggleSetup()">Cancel</button>
                    <button class="btn btn-success" onclick="submitNewGame()">Start Game</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-view" class="mt-4" style="display:none;">
        <div class="card border-dark">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span>Game ID: <small id="display-game-id"></small></span>
                <span id="turn-indicator" class="badge bg-light text-dark"></span>
                <span>
                    <button id="ai-move-btn" class="btn btn-warning mt-3" style="display:none;" onclick="triggerUrMove()">
                        Perform Computer Move
                    </button>
                </span>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 border-end">
                        <h6>Move History</h6>
                        <div id="history-log" style="height: 300px; overflow-y: auto; font-size: 0.9rem;"></div>
                        <div id="store-info" class="alert alert-info py-1 mb-2"></div>
                    </div>
                    <div class="col-md-9 text-center">
                        <div id="toss-result" class="alert alert-info py-1 mb-3"></div>
                        <div id="board-container" class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
function toggleSetup() {
    const setupDiv = document.getElementById('game-setup');
    setupDiv.style.display = (setupDiv.style.display === 'none') ? 'block' : 'none';
}
async function loadBoard(gameId) {
    const response = await fetch(`/game/${gameId}/refresh`);
    const data = await response.json();
    const currentUsername = "{{ user.username }}";
    // Check the Status field from your JSON schema
    if (data.Status === "toss") {
         renderTossView(gameId);
    } else {
        const currentTurn = data.Board.Turn;
        const myData = data.Toss.find(p => p.Player === currentUsername);
        const mySide = myData ? myData.Side : null;
        const aiBtn = document.getElementById('ai-move-btn');
        if (currentTurn !== mySide) {
            aiBtn.style.display = "block";
            aiBtn.innerText = "Perform Opponent Move"; // Clearer labeling
        } else {
            aiBtn.style.display = "none";
        }

        renderPlayerNames(data)
        renderBoard(data);
        // Hide the toss area if it was visible
        const tossArea = document.getElementById('toss-display');
        if (tossArea) tossArea.innerHTML = '';
    }
}

function renderPlayerNames(data) {
    const area = document.getElementById('toss-result');
    if (!data.Toss || data.Toss.length === 0) return;

    // Sort players by Side (0 first, then 1)
    const sortedPlayers = [...data.Toss].sort((a, b) => a.Side - b.Side);
    const currentTurn = data.Board.Turn;

    area.innerHTML = sortedPlayers.map(p => {
        // Highlight logic
        const isActive = (p.Side === currentTurn);
        const activeClass = isActive ? 'border-primary bg-primary text-white shadow' : 'bg-light text-muted';
        const activeLabel = isActive ? '<span class="badge bg-warning text-dark ms-2">THINKING...</span>' : '';

        return `
            <div class="p-3 border rounded-3 text-center transition-all ${activeClass}" style="min-width: 150px;">
                <div class="small fw-bold">SIDE ${p.Side}</div>
                <div class="fs-5">${p.Player}</div>
                ${activeLabel}
            </div>
        `;
    }).join('');
}
function updateTurnDisplay(turn) {
    // Simply re-loading the board is the safest way to sync all UI elements
    const gameId = document.getElementById('display-game-id').innerText;
    loadBoard(gameId);
}
function renderTossView(gameId) {
    const container = document.getElementById('board-container');

    container.innerHTML = `
        <div class="text-center p-5 border rounded bg-light shadow-sm">
            <h2 class="mb-4">Ready to play?</h2>
            <p class="text-muted">Click the button to decide who moves first!</p>
            <button id="toss-btn" class="btn btn-warning btn-lg px-5 py-3 shadow" onclick="handleToss('${gameId}')">
                <i class="bi bi-coin"></i> TOSS
            </button>
        </div>
    `;
}

async function handleToss(gameId) {
    const btn = document.getElementById('toss-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Flipping...';

    try {
        const response = await fetch(`/game/${gameId}/toss`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });

        if (response.ok) {
            // After a successful toss, refresh the board
            // The status will now be 'playing' and the board will render
            loadBoard(gameId);
        }
    } catch (error) {
        console.error("Toss failed:", error);
        btn.disabled = false;
        btn.innerText = "TOSS AGAIN";
    }
}
async function triggerUrMove() {
    const gameId = document.getElementById('display-game-id').innerText;
    const btn = document.getElementById('ai-move-btn');

    // Disable button to prevent double-clicks
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Computer is thinking...';

    try {
        const response = await fetch(`/game/${gameId}/urmove`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            // The computer move API usually doesn't need a body,
            // but we send the ID just in case your view expects it.
            body: JSON.stringify({ "GameID": gameId })
        });

        if (response.ok) {
            const updatedData = await response.json();

            // Log the AI move in history
            const log = document.getElementById('history-log');
            log.innerHTML += `<div class="p-2 border-bottom text-danger">Computer performed a move.</div>`;
            log.scrollTop = log.scrollHeight;

            // Refresh everything (this will also hide the AI button automatically)
            loadBoard(gameId);
        } else {
            alert("Computer move failed. Check server logs.");
        }
    } catch (error) {
        console.error("Error triggering computer move:", error);
    } finally {
        btn.disabled = false;
        btn.innerText = "Perform Opponent Move";
    }
}
function renderStore(data) {
  const container = document.getElementById('store-info');
  const stores = data.Store; // e.g., [{"0":5}, {"1":2}]

  // Map over the array objects, pull out the key-value pair, and make a row
  const rowsHtml = stores.map(store => {
    // Extract the key (side) and value (score) from the object
    const [[side, value]] = Object.entries(store);

    return `
      <tr>
        <th scope="row">Side ${side} Store</th>
        <td class="fw-bold text-center">${value}</td>
      </tr>
    `;
  }).join('');

  // Inject the completed table into the container
  container.innerHTML = `
    <table class="table table-bordered align-middle m-0">
      <thead>
        <tr class="table-light">
          <th>Player Side</th>
          <th class="text-center">Store Count</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>
  `;
}
function renderBoard(data) {

   const container = document.getElementById('board-container');
   const gameId = data.GameID;
   const board = data.Board;
   const pits = board.Pits; // Array of pit objects {Side, Index, Value}
   container.innerHTML = '';
   // 1. Group pits by their "Side" property
   const sidesMap = {};
   pits.forEach(pit => {
       if (!sidesMap[pit.Side]) {
           sidesMap[pit.Side] = [];
       }
       sidesMap[pit.Side].push(pit);
   });
   // 2. Sort the sides (0, 1, 2, 3...) to ensure consistent UI order
   const sideIds = Object.keys(sidesMap).sort((a, b) => a - b);
   // 3. Create a layout container (Vertical stack of rows)
   const boardLayout = document.createElement('div');
   boardLayout.className = "d-flex flex-column gap-4 w-100";

   sideIds.forEach(sideId => {
       // Create a Bootstrap Row for this specific side
       const row = document.createElement('div');
       row.className = `side-row d-flex justify-content-center gap-2 p-2 border rounded`;
       // Add a label for the side (e.g., "Player 0")
       row.setAttribute('data-side', sideId);
       // Optional: Mirror the top rows (odd sides) for a "facing each other" look
       if (sideId % 2 !== 0) {
           row.classList.add('flex-row-reverse');
           row.classList.add('bg-light'); // Slight color diff for clarity
       }
       // 4. Append pits belonging to this side
       sidesMap[sideId].forEach(pit => {
           const pitBtn = createPitElement(pit, gameId, board.Turn);
           row.appendChild(pitBtn);
       });
       boardLayout.appendChild(row);
   });
   container.appendChild(boardLayout);
}
/**
 * Helper to create a pit button
 * pit: {Index, Value, Side}
 */
function createPitElement(pit, gameId, currentTurn) {
    const btn = document.createElement('button');

    // Determine color based on side
    const colors = ['btn-outline-primary', 'btn-outline-danger', 'btn-outline-success', 'btn-outline-warning'];
    const colorClass = colors[pit.Side] || 'btn-outline-secondary';

    btn.className = `btn ${colorClass} rounded-circle d-flex flex-column align-items-center justify-content-center shadow-sm`;
    btn.style.width = "65px";
    btn.style.height = "65px";

    btn.innerHTML = `
        <span class="fw-bold">${pit.Value}</span>
        <small style="font-size: 0.6rem;">${pit.Index}</small>
    `;

    // Logic: You can only move if it's your turn AND the pit belongs to your side
    // (Assuming Player 0 is the logged-in user)
    if (currentTurn === 0 && pit.Side === 0 && pit.Value > 0) {
        btn.onclick = () => submitMove(gameId, pit.Index);
    } else {
        btn.disabled = true;
        btn.classList.add('opacity-75');
    }

    return btn;
}

async function submitMove(gameId, pitIndex) {
    // 1. Get the latest game state to find the last sequence number
    const refreshResponse = await fetch(`/game/${gameId}/refresh`);
    const currentGameData = await refreshResponse.json();

    // 2. Python equivalent logic: Calculate sequence
    let seq = 1;
    if (currentGameData.Moves && currentGameData.Moves.length > 0) {
        // Get the sequence of the last move in the array
        seq = currentGameData.Moves[currentGameData.Moves.length - 1].Sequence;
    }

    // 3. Construct the 'ret' object equivalent
    const movePayload = {
        "GameID": gameId,
        "Move": {
            "Sequence": seq + 1,
            "Timestamp": new Date().toISOString(), // Equivalent to utils.get_timestamp_str()
            "Player": "{{ user.username }}",
            "Index": pitIndex,
        }
    };

    // 4. Send the move
    const response = await fetch(`/game/${gameId}/mymove`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(movePayload)
    });

    if (response.ok) {
        const updatedBoard = await response.json();

        // Update history log
        const log = document.getElementById('history-log');
        log.innerHTML += `<div class="p-2 border-bottom text-primary">You moved Pit ${pitIndex} (Seq: ${seq + 1})</div>`;
        log.scrollTop = log.scrollHeight;
        // Using loadBoard here is safer to ensure all status checks run
        loadBoard(gameId);
    } else {
        console.error("Move failed to submit.");
    }
}

async function submitNewGame() {
    const gameName = document.getElementById('game-name-select').value;
    const gameLevel = document.getElementById('level-select').value;

    // Send POST to your Django view
    const response = await fetch('{% url "api_new_game" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            "Name": {"Value": gameName },
            "Level": {"Value":gameLevel },
            "Players": ["{{ user.username }}", "Computer"]
        })
    });

    const data = await response.json();
    if (data.GameID) {
        // Transition Views inside the <div>
        document.getElementById('lobby-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        document.getElementById('display-game-id').innerText = data.GameID;

        // Load the actual board (call your existing board render function)
        loadBoard(data.GameID);
    }
}
</script>
{% endblock %}
