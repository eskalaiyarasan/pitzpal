{% extends 'common/base.html' %}
{% block title %} New Game{% endblock %}
{% block content %}
<div id="pitzpal-main-container">
    <h1>Welcome, {{ user.username }}!</h1>

    <div id="lobby-view" class="mt-4">
        <div class="d-grid gap-2 col-6">
            <button class="btn btn-primary btn-lg" type="button" onclick="toggleSetup()">
                <i class="bi bi-controller"></i> Create New Game
            </button>
        </div>

        <div id="game-setup" class="card mt-3 shadow-sm" style="display:none;">
            <div class="card-body">
                <h5 class="card-title">Game Settings</h5>
                <hr>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Game Mode</label>
                        <select id="game-name-select" class="form-select">
                            <option value="classic_one_pod">Classic One Pod</option>
                            <option value="classic_one_pro">Classic One Pro</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Difficulty</label>
                        <select id="level-select" class="form-select">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button class="btn btn-outline-secondary me-2" onclick="toggleSetup()">Cancel</button>
                    <button class="btn btn-success" onclick="submitNewGame()">Start Game</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-view" class="mt-4" style="display:none;">
        <div class="card border-dark">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span>Game ID: <small id="display-game-id"></small></span>
                <span id="turn-indicator" class="badge bg-light text-dark"></span>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 border-end">
                        <h6>Move History</h6>
                        <div id="history-log" style="height: 300px; overflow-y: auto; font-size: 0.9rem;"></div>
                    </div>
                    <div class="col-md-9 text-center">
                        <div id="toss-result" class="alert alert-info py-1 mb-3"></div>
                        <div id="board-container" class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
                            </div>
                        <button id="ai-move-btn" class="btn btn-warning mt-3" style="display:none;" onclick="triggerUrMove()">
                            Perform Computer Move
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function toggleSetup() {
    const setupDiv = document.getElementById('game-setup');
    setupDiv.style.display = (setupDiv.style.display === 'none') ? 'block' : 'none';
}
async function loadBoard(gameId) {
    const response = await fetch(`/game/${gameId}/refresh`);
    const boardData = await response.json();

    // boardData is the JSON matching your board.schema.json
    renderBoard(boardData);

    // If you have the initUI function from before, call it for the toss result
    if (typeof initUI === "function") initUI(boardData);
}

function renderBoard(data) {
    const container = document.getElementById('board-container');
    const gameId = data.GameID;
    const board = data.Board;
    const pits = board.Pits; // Array of pit objects {Side, Index, Value}

    container.innerHTML = '';

    // 1. Group pits by their "Side" property
    const sidesMap = {};
    pits.forEach(pit => {
        if (!sidesMap[pit.Side]) {
            sidesMap[pit.Side] = [];
        }
        sidesMap[pit.Side].push(pit);
    });

    // 2. Sort the sides (0, 1, 2, 3...) to ensure consistent UI order
    const sideIds = Object.keys(sidesMap).sort((a, b) => a - b);

    // 3. Create a layout container (Vertical stack of rows)
    const boardLayout = document.createElement('div');
    boardLayout.className = "d-flex flex-column gap-4 w-100";

    sideIds.forEach(sideId => {
        // Create a Bootstrap Row for this specific side
        const row = document.createElement('div');
        row.className = `side-row d-flex justify-content-center gap-2 p-2 border rounded`;

        // Add a label for the side (e.g., "Player 0")
        row.setAttribute('data-side', sideId);

        // Optional: Mirror the top rows (odd sides) for a "facing each other" look
        if (sideId % 2 !== 0) {
            row.classList.add('flex-row-reverse');
            row.classList.add('bg-light'); // Slight color diff for clarity
        }

        // 4. Append pits belonging to this side
        sidesMap[sideId].forEach(pit => {
            const pitBtn = createPitElement(pit, gameId, board.Turn);
            row.appendChild(pitBtn);
        });

        boardLayout.appendChild(row);
    });

    container.appendChild(boardLayout);
}

/**
 * Helper to create a pit button
 * pit: {Index, Value, Side}
 */
function createPitElement(pit, gameId, currentTurn) {
    const btn = document.createElement('button');

    // Determine color based on side
    const colors = ['btn-outline-primary', 'btn-outline-danger', 'btn-outline-success', 'btn-outline-warning'];
    const colorClass = colors[pit.Side] || 'btn-outline-secondary';

    btn.className = `btn ${colorClass} rounded-circle d-flex flex-column align-items-center justify-content-center shadow-sm`;
    btn.style.width = "65px";
    btn.style.height = "65px";

    btn.innerHTML = `
        <span class="fw-bold">${pit.Value}</span>
        <small style="font-size: 0.6rem;">${pit.Index}</small>
    `;

    // Logic: You can only move if it's your turn AND the pit belongs to your side
    // (Assuming Player 0 is the logged-in user)
    if (currentTurn === 0 && pit.Side === 0 && pit.Value > 0) {
        btn.onclick = () => submitMove(gameId, pit.Index);
    } else {
        btn.disabled = true;
        btn.classList.add('opacity-75');
    }

    return btn;
}

async function submitMove(gameId, pitIndex) {
    const response = await fetch(`/${gameId}/mymove`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            "GameID": gameId,
            "Move": pitIndex
        })
    });

    const updatedBoard = await response.json();

    // Update the history log (on the left)
    const log = document.getElementById('history-log');
    log.innerHTML += `<div class="p-2 border-bottom text-primary">You moved Pit ${pitIndex}</div>`;
    log.scrollTop = log.scrollHeight; // Auto-scroll

    // Re-render the board with the new state
    renderBoard(updatedBoard);
    updateTurnDisplay(updatedBoard.Board.Turn);
}

async function submitNewGame() {
    const gameName = document.getElementById('game-name-select').value;
    const gameLevel = document.getElementById('level-select').value;

    // Send POST to your Django view
    const response = await fetch('{% url "api_new_game" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            "Name": {"Value": gameName },
            "Level": {"Value":gameLevel },
            "Players": ["{{ user.username }}", "Computer"]
        })
    });

    const data = await response.json();
    if (data.GameID) {
        // Transition Views inside the <div>
        document.getElementById('lobby-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        document.getElementById('display-game-id').innerText = data.GameID;

        // Load the actual board (call your existing board render function)
        loadBoard(data.GameID);
    }
}
</script>
{% endblock %}
