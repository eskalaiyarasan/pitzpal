{% extends 'common/base.html' %}
{% load i18n %}
{% block title %} {% trans "New Game" %} {% endblock %}
{% block content %}
<style>
    /* Pulse glow effect for pits receiving seeds */
    .animated-glow {
        transform: scale(1.12);
        box-shadow: 0 0 20px rgba(255, 193, 7, 0.95) !important;
        border-color: #ffc107 !important;
        background-color: #fff3cd !important;
        transition: all 0.2s ease-in-out;
        z-index: 10;
    }
    .pit-transition {
        transition: all 0.4s ease;
    }
</style>
<div id="pitzpal-main-container">
    <h1>{% trans "Welcome" %}, {{ user.username }}!</h1>

    <div id="lobby-view" class="mt-4">
        <div class="d-grid gap-2 col-6">
            <button class="btn btn-primary btn-lg" type="button" onclick="toggleSetup()">
                <i class="bi bi-controller"></i> {% trans "Create New Game" %}
            </button>
        </div>

        <div id="game-setup" class="card mt-3 shadow-sm" style="display:none;">
            <div class="card-body">
                <h5 class="card-title">{% trans "Game Settings" %}</h5>
                <hr>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">{% trans "Game Mode" %}</label>
                        <select id="game-name-select" class="form-select">
                            <option value="classic_one">{% trans "Classic Standard" %} </option>
                            <option value="classic_kingz">{% trans "Classic Premium" %}</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{% trans "Difficulty" %} </label>
                        <select id="level-select" class="form-select">
                            <option value="easy">{% trans "Easy" %}</option>
                            <option value="medium">{% trans "Medium" %} </option>
                            <option value="hard">{% trans "Hard" %}</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button class="btn btn-outline-secondary me-2" onclick="toggleSetup()">{% trans "Cancel" %}</button>
                    <button class="btn btn-success" onclick="showGameRules()">{% trans "Start Game" %}</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="rulesModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="rulesModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-light">
                    <h5 class="modal-title id="rulesModalLabel" class="fw-bold">
                        <i class="bi bi-book text-primary me-2"></i>{% trans "Game Rules & Conditions" %}
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="rules-modal-body">
                    <div class="text-center my-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{% trans "Decline" %}</button>
                    <button type="button" class="btn btn-success" id="accept-rules-btn" onclick="submitNewGame()">{% trans "Accept & Start" %}</button>
                </div>
            </div>
        </div>
    </div>
    <div id="game-view" class="mt-4" style="display:none;">
        <div class="card border-dark">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span>Game ID: <small id="display-game-id"></small></span>
                <span id="rounds-indicator" class="badge bg-light text-dark"></span>
                <span>
                    <button id="resign-move-btn" class="btn btn-warning mt-3" style="display:none;" onclick="triggerResign()">
                        {% trans "Resign" %}
                    </button>
                </span>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 border-end">
                        <h6>{% trans "Move History" %}</h6>
                        <div id="history-log" style="height: 300px; overflow-y: auto; font-size: 0.9rem;"></div>
                        <div id="store-info" class="alert alert-info py-1 mb-2"></div>
                    </div>
                    <div class="col-md-9 text-center">
                        <div id="toss-result" class="alert alert-info py-1 mb-3"></div>
                        <div id="board-container" class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let isAnimationPlaying = false;
let rulesModalInstance = null;
function showGameRules() {
    const gameName = document.getElementById('game-name-select').value;
    const gameLevel = document.getElementById('level-select').value;
    const modalBody = document.getElementById('rules-modal-body');

    // 1. Initialize and show the modal with a loading spinner right away
    if (!rulesModalInstance) {
        rulesModalInstance = new bootstrap.Modal(document.getElementById('rulesModal'));
    }

    modalBody.innerHTML = `
        <div class="text-center my-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">{% trans "Fetching game rules..." %}</p>
        </div>
    `;
    rulesModalInstance.show();

    // 2. Fetch the rules from your server route
    // Note: using your route format /doc/${game_name}_${game_level}
    fetch(`/doc/${gameName}_${gameLevel}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            // Use .text() if your server returns HTML/Markdown text,
            // or .json() if it returns JSON object structure
            return response.text();
        })
        .then(data => {
            // 3. Inject the retrieved rules into the modal
            modalBody.innerHTML = data;
        })
        .catch(error => {
            console.error('Error fetching rules:', error);
            modalBody.innerHTML = `
                <div class="alert alert-danger role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {% trans "Failed to load game rules. Please try again." %}
                </div>
            `;
        });
}
function toggleSetup() {
    const setupDiv = document.getElementById('game-setup');
    setupDiv.style.display = (setupDiv.style.display === 'none') ? 'block' : 'none';
}

function renderGameOver(data) {
    const container = document.getElementById('board-container');
    const tossResultArea = document.getElementById('toss-result');
    const aiBtn = document.getElementById('resign-move-btn');

    // Hide active gameplay elements we no longer need
    if (aiBtn) aiBtn.style.display = "none";
    if (tossResultArea) tossResultArea.innerHTML = '';

    // Initialize map variables to parse scores
    let scores = {};
    if (data.Board.Store && data.Board.Store.length > 0) {
        data.Board.Store.forEach(store => {
            const [[side, value]] = Object.entries(store);
            scores[side] = parseInt(value, 10);
        });
    }

    // Default scores to 0 if they don't exist in the payload
    const score0 = scores["0"] || 0;
    const score1 = scores["1"] || 0;

    // Determine the winning side
    let winnerSide = null;
    let titleText = "It's a Tie!";
    let alertClass = "alert-secondary";

    if (score0 > score1) {
        winnerSide = 0;
        alertClass = "alert-success";
    } else if (score1 > score0) {
        winnerSide = 1;
        alertClass = "alert-success";
    }

    // Map the side numbers to real player names using the Toss array
    let player0Name = "Side 0";
    let player1Name = "Side 1";
    if (data.Toss && data.Toss.length > 0) {
        const p0 = data.Toss.find(p => String(p.Side) === "0");
        const p1 = data.Toss.find(p => String(p.Side) === "1");
        if (p0) player0Name = p0.Player;
        if (p1) player1Name = p1.Player;
    }

    // Set final winner display string
    if (winnerSide !== null) {
        const winnerName = (winnerSide === 0) ? player0Name : player1Name;
        titleText = `🎉🏆 Winner: ${winnerName}!`;
    }

    // Render a polished Game Over breakdown inside the main container
    container.innerHTML = `
        <div class="card shadow border-0 w-100 p-4">
            <div class="alert ${alertClass} text-center py-4 mb-4">
                <h2 class="display-5 fw-bold mb-0">${titleText}</h2>
                <p class="text-muted mt-2 mb-0">{% trans "The game has concluded successfully" %}.</p>
            </div>

            <div class="row justify-content-center text-center g-4 mb-4">
                <div class="col-sm-5">
                    <div class="p-3 border rounded ${winnerSide === 0 ? 'border-success bg-light shadow-sm' : 'bg-light text-muted'}">
                        <span class="badge ${winnerSide === 0 ? 'bg-success' : 'bg-secondary'} mb-2">SIDE 0</span>
                        <h4 class="mb-1 text-truncate">${player0Name}</h4>
                        <div class="display-6 fw-bold">${score0}</div>
                        <small class="text-muted">{% trans "Final Seeds" %}</small>
                    </div>
                </div>
                <div class="col-sm-2 d-flex align-items-center justify-content-center">
                    <span class="fw-bold text-muted fs-4">VS</span>
                </div>
                <div class="col-sm-5">
                    <div class="p-3 border rounded ${winnerSide === 1 ? 'border-success bg-light shadow-sm' : 'bg-light text-muted'}">
                        <span class="badge ${winnerSide === 1 ? 'bg-success' : 'bg-secondary'} mb-2">SIDE 1</span>
                        <h4 class="mb-1 text-truncate">${player1Name}</h4>
                        <div class="display-6 fw-bold">${score1}</div>
                        <small class="text-muted">{% trans "Final Seeds" %}</small>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-primary btn-lg px-4" onclick="window.location.reload();">
                    <i class="bi bi-arrow-clockwise"></i> {% trans "return to Lobby" %}
                </button>
            </div>
        </div>
    `;

    // Also explicitly update the store info block sidebar with final values
    renderStore(data);
    renderMoveHistory(data);
}

function renderMoveHistory(data) {
    const log = document.getElementById('history-log');
    if (!log) return;

    if (!data.Moves || data.Moves.length === 0) {
        log.innerHTML = `<div class="p-2 text-muted text-center small">{% trans "No moves recorded yet" %}.</div>`;
        return;
    }

    const currentUsername = "{{ user.username }}";

    // Sort moves by sequence to ensure proper chronological layout order
    const sortedMoves = [...data.Moves].sort((a, b) => a.Move.Sequence - b.Move.Sequence);

    log.innerHTML = sortedMoves.map(move => {
        const isMe = move.Move.Player === currentUsername;
        const colorClass = isMe ? 'text-primary' : 'text-danger';
        const displayName = isMe ? '{% trans "You" %}' : move.Move.Player.split('-')[0]; // cleaner handling if computer uuid is trailing

        return `
            <div class="p-2 border-bottom d-flex justify-content-between align-items-center">
                <div>
                    <span class="fw-bold ${colorClass}">${displayName}</span>
                    <span>{% trans "moved Pit" %} <strong>${move.Move.Index}</strong></span>
                </div>
                <span class="badge bg-secondary text-white font-monospace small">#${move.Move.Sequence}</span>
            </div>
        `;
    }).join('');

    // Automatically pull focus wrapper to the latest entry item
    log.scrollTop = log.scrollHeight;
}

async function loadBoard(gameId) {
    try {
        const response = await fetch(`/game/${gameId}/refresh`);
        const data = await response.json();
        const currentUsername = "{{ user.username }}";

        // Always update the move history list with fresh payload structure
        renderMoveHistory(data);

        if (data.Status === "done") {
            renderGameOver(data);
            return; // Stop further board rendering since the game is finished
        }
        if (data.Status === "toss") {
            renderTossView(gameId);
        } else {
            const currentTurn = data.Board ? data.Board.Turn : 0;
            const myData = data.Toss ? data.Toss.find(p => p.Player === currentUsername) : null;
            const mySide = myData ? myData.Side : null;
            const aiBtn = document.getElementById('resign-move-btn');

            if (currentTurn !== mySide) {
                aiBtn.style.display = "none";
                setTimeout(() => {
                    triggerUrMove(gameId);
                }, 2000);
            } else {
                aiBtn.style.display = "block";
                aiBtn.innerText = "Resign";
            }

            // Render components safely
            renderStore(data);
            renderPlayerNames(data);
            renderBoard(data, mySide);

            const tossArea = document.getElementById('toss-display');
            if (tossArea) tossArea.innerHTML = '';
        }
    } catch (err) {
        console.error("Failed to load layout updates:", err);
    }
}
function renderPlayerNames(data) {
    const area = document.getElementById('toss-result');
    if (!data.Toss || data.Toss.length === 0) return;

    const sortedPlayers = [...data.Toss].sort((a, b) => a.Side - b.Side);
    const currentTurn = data.Board ? data.Board.Turn : 0;

    // Wrap everything in a single flex row for a compact, one-line layout
    area.innerHTML = `
        <div class="d-flex align-items-center gap-3 small">
            ${sortedPlayers.map(p => {
                const isActive = (p.Side === currentTurn);

                // Active player gets bold/colored text; inactive gets muted/gray text
                const textClass = isActive ? 'fw-bold text-dark' : 'text-muted opacity-75';
                const indicator = isActive ? '<span class="spinner-grow spinner-grow-sm text-warning me-1" role="status"></span><span class="badge bg-primary">Turn</span>' : '';

                return `
                    <div class="d-flex align-items-center ${textClass}">
                        ${indicator}
                        <span class="ms-1">${p.Player} (S${p.Side})</span>
                    </div>
                `;
            }).join('<span class="text-muted">vs</span>')}
        </div>
    `;
}
function updateTurnDisplay(turn) {
    const gameId = document.getElementById('display-game-id').innerText;
    loadBoard(gameId);
}

function renderTossView(gameId) {
    const container = document.getElementById('board-container');
    container.innerHTML = `
        <div class="text-center p-5 border rounded bg-light shadow-sm w-100">
            <h2 class="mb-4">{% trans "Ready to play" %}?</h2>
            <p class="text-muted">Click the button to decide who moves first!</p>
            <button id="toss-btn" class="btn btn-warning btn-lg px-5 py-3 shadow" onclick="handleToss('${gameId}')">
                <i class="bi bi-coin"></i> {% trans "TOSS" %}
            </button>
        </div>
    `;
}

async function handleToss(gameId) {
    const btn = document.getElementById('toss-btn');
    if (!btn) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> {% trans "Flipping" %}...';

    try {
        const response = await fetch(`/game/${gameId}/toss`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });

        if (response.ok) {
            await loadBoard(gameId);
        } else {
            throw new Error("Server rejected flip event status");
        }
    } catch (error) {
        console.error("Toss failed:", error);
        btn.disabled = false;
        btn.innerText = "TOSS AGAIN";
    }
}
function disableAllInputs(disable) {
    document.querySelectorAll('#board-container button').forEach(btn => {
        btn.disabled = disable;
    });
    const resignBtn = document.getElementById('resign-move-btn');
    if (resignBtn) resignBtn.disabled = disable;
}
function updateNrounds(displayValue){
  const textClass = "text-dark"; // Your custom text class variable
  const container = document.getElementById('rounds-indicator');
  if (!container) return;
  container.innerHTML = `
      <div class="d-flex align-items-center ${textClass}">
          <div class="spinner-border text-warning spinner-border-sm me-2" role="status">
              <span class="visually-hidden">Loading...</span>
          </div>
          <span class="fw-bold fs-5">${displayValue}</span>
      </div>
  `;
}
async function animateMoveDetails(detail) {
    if (!detail || detail.length === 0) return;
    isAnimationPlaying = true;
    disableAllInputs(true);

    // Helper function to create a delay between animation steps
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    for (const step of detail) {
      if ("RoundUp" in step){
        updateNrounds(step.Nrounds)
      }
      if ("Store" in step) {
        updateAndGlowStore(step.Store)
      }
      if("Index" in step){
        const pitButton = document.querySelector(`button[data-pit-index="${step.Index}"]`);
        pitButton.classList.add('animated-glow');
        if("Value" in step){
          const valueDisplay = pitButton.querySelector('.pit-value');
          if (valueDisplay) {
              valueDisplay.innerText = step.Value;
          }

        }
        // Remove the glow after 500ms so the next pit can animate cleanly
          setTimeout(() => {
              pitButton.classList.remove('animated-glow');
          }, 500);
      }
      // 2. Pause for 600ms between each seed dropping step so humans can track it
      await sleep(600);
    }
    isAnimationPlaying = false;
    disableAllInputs(false);
}
async function triggerUrMove() {
    const gameId = document.getElementById('display-game-id').innerText;
    const btn = document.getElementById('resign-move-btn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> {% trans "Computer is thinking" %}...';

    try {
        const response = await fetch(`/game/${gameId}/urmove`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ "GameID": gameId })
        });

        if (response.ok) {
            resp = await response.json();
            await animateMoveDetails(resp.Detail)
            await loadBoard(gameId);
        } else {
            alert("Computer move failed. Check server logs.");
        }
    } catch (error) {
        console.error("Error triggering computer move:", error);
    } finally {
        if(btn) {
            btn.disabled = false;
            btn.innerText = "Resign";
        }
    }
}

async function triggerResign() {
    const gameId = document.getElementById('display-game-id').innerText;
    const btn = document.getElementById('resign-move-btn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> {% trans "Computer is thinking" %}...';

    try {
        const response = await fetch(`/game/${gameId}/resign`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ "GameID": gameId })
        });

        if (response.ok) {
            await loadBoard(gameId);
        } else {
            alert("Computer move failed. Check server logs.");
        }
    } catch (error) {
        console.error("Error triggering computer move:", error);
    } finally {
        if(btn) {
            btn.disabled = false;
            btn.innerText = "Resign";
        }
    }
}
function renderStore(data) {
  const container = document.getElementById('store-info');
  if (!container) return;

  const stores = data.Board.Store;
  if (!stores || stores.length === 0) {
      container.innerHTML = '<div class="text-muted small">{% trans "No store values available yet" %}.</div>';
      return;
  }

  const rowsHtml = stores.map(store => {
    const entries = Object.entries(store);
    if(entries.length === 0) return '';
    const [[side, value]] = entries;

    // Added 'pit-transition' and 'data-side' to the row
    return `
      <tr data-side="${side}" class="pit-transition">
        <th scope="row">{% trans "Store" %}</th>
        <td class="fw-bold text-center value-cell">${value}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <table class="table table-bordered align-middle m-0 small">
      <thead>
        <tr class="table-light">
          <th>Player Side</th>
          <th class="text-center">{% trans "Store Count" %}</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>
  `;
}

// Function to handle the input, update the value, and trigger your glow
function updateAndGlowStore(input) {
  const [[side, newValue]] = Object.entries(input);
  const targetRow = document.querySelector(`tr[data-side="${side}"]`);

  if (targetRow) {
    // 1. Update the value cell text
    const valueCell = targetRow.querySelector('.value-cell');
    if (valueCell) {
      valueCell.textContent = newValue;
    }

    // 2. Apply your existing animated-glow class
    targetRow.classList.add('animated-glow');

    // 3. Remove the glow after 800ms so it smoothly scales down and fades out
    setTimeout(() => {
      targetRow.classList.remove('animated-glow');
    }, 800);
  }
}

function renderBoard(data, myside) {
   const container = document.getElementById('board-container');
   if (!container) return;

   if (!data.Board || !data.Board.Pits) {
       container.innerHTML = '<div class="text-muted">{% trans "Initializing game map items" %}...</div>';
       return;
   }

   const gameId = data.GameID;
   const board = data.Board;
   const pits = board.Pits;
   container.innerHTML = '';

   const sidesMap = {};
   pits.forEach(pit => {
       if (!sidesMap[pit.Side]) {
           sidesMap[pit.Side] = [];
       }
       sidesMap[pit.Side].push(pit);
   });

   const sideIds = Object.keys(sidesMap).sort((a, b) => a - b);
   const boardLayout = document.createElement('div');
   boardLayout.className = "d-flex flex-column gap-4 w-100";

   sideIds.forEach(sideId => {
       const row = document.createElement('div');
       row.className = `side-row d-flex justify-content-center gap-2 p-2 border rounded`;
       row.setAttribute('data-side', sideId);

       if (sideId % 2 !== 0) {
           row.classList.add('flex-row-reverse');
           row.classList.add('bg-light');
       }

       sidesMap[sideId].forEach(pit => {
           const pitBtn = createPitElement(pit, gameId, board.Turn, myside);
           row.appendChild(pitBtn);
       });
       boardLayout.appendChild(row);
   });
   container.appendChild(boardLayout);
}

function createPitElement(pit, gameId, currentTurn, myside) {
  const btn = document.createElement('button');
  const colors = ['btn-outline-primary', 'btn-outline-danger', 'btn-outline-success', 'btn-outline-warning'];
  colorClass = colors[pit.Side] || 'btn-outline-secondary';
  btn.className = `btn ${colorClass} rounded-circle d-flex flex-column align-items-center justify-content-center shadow-sm`;
	if (pit.Public === true){
           btn.className = `btn bg-dark text-white rounded-circle d-flex flex-column align-items-center justify-content-center shadow-sm`;
	}


    btn.style.width = "65px";
    btn.style.height = "65px";
    btn.setAttribute('data-pit-index', pit.Index);

    btn.innerHTML = `
        <span class="fw-bold pit-value">${pit.Value}</span>
    `;

    if (pit.Active === false) {
        btn.classList.add('invisible');
        btn.disabled = true;
        return btn; // Return early since no further rendering or logic is needed
    }
    if (currentTurn === myside && Number(pit.Side) === myside && pit.Value > 0 && pit.Public === false) {
        btn.onclick = () => submitMove(gameId, pit.Index);
    } else {
        btn.disabled = true;
        btn.classList.add('opacity-75');
    }

    return btn;
}

async function submitMove(gameId, pitIndex) {
    try {
        const refreshResponse = await fetch(`/game/${gameId}/refresh`);
        const currentGameData = await refreshResponse.json();

        let seq = 1;
        if (currentGameData.Moves && currentGameData.Moves.length > 0) {
            seq = currentGameData.Moves[currentGameData.Moves.length - 1].Move.Sequence;
        }

        const movePayload = {
            "GameID": gameId,
            "Move": {
                "Sequence": seq + 1,
                "Timestamp": new Date().toISOString(),
                "Player": "{{ user.username }}",
                "Index": pitIndex,
            }
        };

        const response = await fetch(`/game/${gameId}/mymove`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(movePayload)
        });

        if (response.ok) {
            resp = await response.json();
            await animateMoveDetails(resp.Detail)
            await loadBoard(gameId);
        } else {
            console.error("Move failed to submit.");
        }
    } catch (e) {
        console.error(e);
    }
}

async function submitNewGame() {
    try {
        const gameName = document.getElementById('game-name-select').value;
        const gameLevel = document.getElementById('level-select').value;
        // 1. Hide the rules modal safely
            if (rulesModalInstance) {
                rulesModalInstance.hide();
            }
        const response = await fetch('{% url "api_new_game" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                "Name": {"Value": gameName },
                "Level": {"Value":gameLevel },
                "Players": ["{{ user.username }}", "Computer"]
            })
        });

        const data = await response.json();
        if (data.GameID) {
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'block';
            document.getElementById('display-game-id').innerText = data.GameID;
            await loadBoard(data.GameID);
        }
    } catch(e) {
        console.error(e);
    }
}
</script>
{% endblock %}
