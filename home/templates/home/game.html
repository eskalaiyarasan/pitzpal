<!-- templates/home/game.html -->
{% extends 'common/base.html' %}
{% block title %}Home Page{% endblock %}
{% block content %}
<h2>Game #{{ game.id }} - Playing as {{ user_color }}</h2>
<div id="board" style="width: 400px; margin: auto;"></div>
<p id="status">Status: Waiting for move...</p>

<!-- Chess Libraries -->
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
    const gameId = "{{ game.id }}";
    const userColor = "{{ user_color }}";
    const boardEl = $('#board');
    const chess = new Chess();

    // 1. Initialize WebSocket for moves
    const gameSocket = new WebSocket(`ws://${window.location.host}/ws/game/${gameId}/`);

    // 2. Logic when a piece is dropped
    function onDrop(source, target) {
        let move = chess.move({ from: source, to: target, promotion: 'q' });

        if (move === null) return 'snapback'; // Illegal move

        // Send move to server
        gameSocket.send(JSON.stringify({
            'type': 'move',
            'move': move.san,
            'board_state': chess.fen()
        }));
    }

    // 3. Setup Board
    const config = {
        draggable: true,
        position: 'start',
        orientation: userColor,
        onDrop: onDrop
    };
    const board = Chessboard('board', config);

    // 4. Receive moves from opponent
    gameSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        if (data.type === 'move') {
            chess.move(data.move);
            board.position(chess.fen());
        }
    };
</script>
{% endblock %}
