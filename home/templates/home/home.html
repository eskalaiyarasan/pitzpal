{% extends 'common/base.html' %}
{% block title %}Home Page{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h1>Welcome, {{ user.username }}!</h1>
            <p class="lead">

            </p>

        </div>

        <!-- Player Dashboard -->
        <div class="col-md-4">
            <div class="card border-primary">
                <div class="card-header bg-primary text-white">
                    Player Statistics
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong>Rating</strong>
                        <span class="badge bg-success rounded-pill">{{ user.rating }}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong>Wins</strong>
                        <span>{{ user.wins }}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong>Total games</strong>
                        <span>{{ user.total }}</span>
                    </li>

                </ul>
            </div>
            <div>
                <p><a href="{% url 'friends_list' %}">Friends</a></p>
                <p><a href="{%url 'search' %}"> Search Friends</a></p>
                <p><a href="{%url 'friend_requests' %}"> Friend requests</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
