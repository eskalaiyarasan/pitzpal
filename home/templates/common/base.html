
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}My Django Site{% endblock %}</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        {% load static %}
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">

                <a class="navbar-brand d-flex align-items-center" href="#">
                            <img src="{% static 'images/logo.png' %}" alt="Pitzpal Logo" height="30" class="me-2">
                            <span>Pitzpal</span>
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" href="/home">{{ user.username }}</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="friendsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        Friends
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="friendsDropdown">
                                <li><a class="dropdown-item" href="{% url 'friends_list' %}">View</a></li>
                                <li><a class="dropdown-item" href="{%url 'search' %}">Search</a></li>
                                <li><a class="dropdown-item" href="{%url 'friend_requests' %}">Request</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/about">About</a>
                        </li>
                        <li class="nav-item">
                            {% if user.is_authenticated %}
                                <!-- We use a form instead of a link to provide the required POST method -->
                                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                                    {% csrf_token %}
                                    <button type="submit" class="nav-link" ">
                                        Logout
                                    </button>
                                </form>
                            {% endif %}
                        </li>

                    </ul>
                </div>
            </div>
        </nav>

        <!-- Content Block -->
        <div class="container mt-4">
            {% if user.is_authenticated %}
            {% block content %}
            <!-- Unique page content goes here -->
            {% endblock %}
            {% endif %}
        </div>

        <!-- Bootstrap JS (Necessary for Navbar toggling) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
